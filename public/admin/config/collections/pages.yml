collections:
  - name: 'pages'
    label: 'Pages'
    folder: '${PAGES_FOLDER}'
    create: true
    editor:
      preview: false
    slug: '{{slug}}'
    view_groups:
      default: by-projeto
      groups:
        - name: by-projeto
          label: Project
          field: projeto
    fields:
      - { label: 'Preview', name: 'standalone', widget: 'boolean', default: true, required: false, hint: 'Disable if this page should only exist when embedded via Include in another page.' }

      - { label: 'Title', name: 'title', widget: 'string', required: false }
      - { label: 'Slug', name: 'slug', widget: 'string', required: true, hint: 'final part of the URL that corresponds to this page (ex: documental.xyz/slug)' }
      - { label: 'Project', name: 'projeto', widget: 'string', required: false, hint: 'Project name for grouping. Use the same value in related pages.' }

      # Resources — all toggle sections.
      # `widget: object` + `required: false` makes Sveltia render a checkbox:
      # unchecked => object saved as null; checked => subfields appear.
      - *pageSettings
      - *pageTheme
      - label: 'Page Include'
        name: 'pageInclude'
        widget: 'object'
        required: false
        collapsed: true
        fields:
          - label: 'Main page slug'
            name: 'mainSlug'
            widget: 'relation'
            collection: 'pages'
            value_field: '{{slug}}'
            search_fields: ['title', 'slug']
            display_fields: ['title', 'slug']
            required: false
            hint: 'Slug of the main page in this chain.'
            filters:
              - field: slug
                values: ['{{slug}}']
                exclude: true
      - label: 'Modules'
        name: 'modules'
        widget: 'list'
        required: false
        collapsed: true
        label_singular: 'Module'
        min: 0
        max: 1
        types:
          - *mapBox

      - label: 'Components'
        name: 'components'
        widget: 'list'
        required: false
        collapsed: true
        min: 0
        max: 15
        types:
          - *group
          - *cta
          - *map
          - *spacer
          - *include
