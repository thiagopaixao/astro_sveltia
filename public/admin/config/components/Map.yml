map: &map
  label: 'Map'
  name: 'Map'
  widget: 'object'
  summary: '{{fields.shortTitle}}'
  collapsed: true
  fields:
    - label: 'Type'
      name: 'type'
      widget: 'hidden'
      default: 'Map'
      collapsed: true
    - label: 'ID'
      name: 'id'
      widget: 'string'
      required: true
      collapsed: true
    - label: 'Short Title'
      name: 'shortTitle'
      widget: 'string'
      required: true
      hint: 'Short title (required) - will be used in the future'
      collapsed: true
    - label: 'Long Title'
      name: 'longTitle'
      widget: 'string'
      required: false
      hint: 'Long title used as the menu label (optional)'
      collapsed: true
    - label: 'Description'
      name: 'description'
      widget: 'text'
      required: false
      hint: 'Component description (optional) - will be used in the future'
      collapsed: true
    - label: 'Show in Menu'
      name: 'showInMenu'
      widget: 'boolean'
      default: false
      hint: 'Enable to show this component in the navigation menu'
      collapsed: true
    - label: 'Animations'
      name: 'animations'
      widget: 'boolean'
      default: true
      required: true
      hint: 'Enable/disable animations for this component'
      collapsed: true
    - label: 'Column Align'
      name: 'columnAlign'
      widget: 'select'
      options: ['left', 'right', 'center']
      default: 'left'
      required: true
      collapsed: true
    - label: 'Floating Text'
      name: 'floatingText'
      widget: 'boolean'
      required: false
      default: false
      collapsed: true
    - label: 'Text Color'
      name: 'txtColor'
      widget: 'select'
      options:
        - { label: 'Primary', value: 'Primary' }
        - { label: 'Secondary', value: 'Secondary' }
        - { label: 'Highlight', value: 'Highlight' }
      default: 'Primary'
      required: false
      collapsed: true
    - label: 'Background Color'
      name: 'bgColor'
      widget: 'select'
      options:
        - { label: 'Primary', value: 'Primary' }
        - { label: 'Secondary', value: 'Secondary' }
        - { label: 'Highlight', value: 'Highlight' }
      default: 'Secundary'
      required: false
      collapsed: true
    - label: 'Components'
      name: 'components'
      # max: 56 — baseado em nhanderekoa.md (max 45 instâncias em um único Map, soma 143 em 6 maps). Permite ~25% crescimento.
      # Adicionado em Fase 1 do plano sveltia-perf para prevenir agravamento de lag.
      # Ver .omo/plans/sveltia-perf-fase0-fase1.md Task 8.
      widget: 'list'
      min: 0
      max: 56
      required: false
      collapsed: true
      types:
        - *text
        - *spacer
        - *mapView
        - *imageBlock
        - *videoEmbed
        - *timeline
        - *button
