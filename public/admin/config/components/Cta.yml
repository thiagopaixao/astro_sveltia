cta: &cta
  label: 'Call to Action'
  name: 'Cta'
  widget: 'object'
  summary: '{{fields.shortTitle}}'
  collapsed: true
  fields:
    - label: 'Type'
      name: 'type'
      widget: 'hidden'
      default: 'Cta'
      collapsed: true
    - label: 'ID'
      name: 'id'
      widget: 'string'
      required: true
      collapsed: true
    - label: 'Short Title'
      name: 'shortTitle'
      widget: 'string'
      required: true
      hint: 'Short title (required) - will be used in the future'
      collapsed: true
    - label: 'Long Title'
      name: 'longTitle'
      widget: 'string'
      required: false
      hint: 'Long title used as the menu label (optional)'
      collapsed: true
    - label: 'Description'
      name: 'description'
      widget: 'text'
      required: false
      hint: 'Component description (optional) - will be used in the future'
      collapsed: true
    - label: 'Show in Menu'
      name: 'showInMenu'
      widget: 'boolean'
      default: false
      hint: 'Enable to show this component in the navigation menu'
      collapsed: true
    - label: 'Animations'
      name: 'animations'
      widget: 'boolean'
      default: true
      required: true
      hint: 'Enable/disable animations for this component'
      collapsed: true
    - label: 'Text Color'
      name: 'txtColor'
      widget: 'select'
      options:
        - { label: 'Primary', value: 'Primary' }
        - { label: 'Secondary', value: 'Secondary' }
        - { label: 'Highlight', value: 'Highlight' }
        - { label: 'Custom', value: 'Custom' }
      default: 'Primary'
      required: false
      collapsed: true
    - label: 'Custom Text Color'
      name: 'customTxtColor'
      widget: 'color'
      required: false
      enableAlpha: true
      allowInput: true
      collapsed: true
    - label: 'Background Color'
      name: 'bgColor'
      widget: 'select'
      options:
        - { label: 'Primary', value: 'Primary' }
        - { label: 'Secondary', value: 'Secondary' }
        - { label: 'Highlight', value: 'Highlight' }
        - { label: 'Custom', value: 'Custom' }
      default: 'Secondary'
      required: false
      collapsed: true
    - label: 'Custom Background Color'
      name: 'customBgColor'
      widget: 'color'
      required: false
      enableAlpha: true
      allowInput: true
      collapsed: true
    - label: 'Add Background media'
      name: 'backgroundMedia'
      required: false
      widget: 'list'
      max: 1
      collapsed: true
      types:
        - label: 'Image'
          name: 'backgroundImage'
          widget: 'object'
          collapsed: true
          fields:
            - label: 'Image'
              name: 'imgSrc'
              widget: 'image'
              required: false
              multiple: false
              collapsed: true
        - label: 'Video'
          name: 'backgroundVideo'
          widget: 'object'
          collapsed: true
          fields:
            - label: 'Video'
              name: 'videoSrc'
              widget: 'file'
              multiple: false
              required: false
              collapsed: true
    - label: 'Overlay'
      name: 'overlay'
      widget: 'select'
      options:
        - { label: 'Dark', value: 'dark' }
        - { label: 'Light', value: 'light' }
      required: false
      collapsed: true
    - label: 'Add media'
      name: 'ctaMedia'
      required: false
      widget: 'list'
      max: 1
      collapsed: true
      types:
        - label: 'Image'
          name: 'ctaImage'
          widget: 'object'
          collapsed: true
          fields:
            - label: 'Image'
              name: 'src'
              widget: 'image'
              required: false
              multiple: false
              collapsed: true
            - label: 'Or external URL'
              name: 'externalUrl'
              widget: 'string'
              required: false
              hint: 'External URL (optional, replaces the image above)'
              collapsed: true
        - label: 'Video'
          name: 'ctaVideo'
          widget: 'object'
          collapsed: true
          fields:
            - label: 'Video'
              name: 'src'
              widget: 'file'
              multiple: false
              required: false
              collapsed: true
            - label: 'Or external URL'
              name: 'externalUrl'
              widget: 'string'
              required: false
              hint: 'External URL (optional, replaces the video above)'
              collapsed: true
    - label: 'CTA Text'
      name: 'ctaText'
      widget: 'markdown'
      required: false
      collapsed: true
    - label: 'Add Highlighted Text'
      name: 'highlightedText'
      widget: 'string'
      required: false
      hint: 'highlighted text shown when no media is uploaded'
      collapsed: true
    - label: 'Link'
      name: 'link'
      widget: 'object'
      required: false
      collapsed: true
      fields:
        - label: 'URL'
          name: 'url'
          widget: 'string'
          required: false
          collapsed: true
        - label: 'Target'
          name: 'target'
          widget: 'select'
          options: ['_self', '_blank']
          default: '_self'
          required: false
          collapsed: true
        - label: 'Text'
          name: 'text'
          widget: 'string'
          required: false
          collapsed: true
